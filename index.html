<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocationGuessr</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mapillary-js@4.1.2/dist/mapillary.css">
<style>
:root{--ink:#0f3b4a;--paper:#f3efe2;--buoy:#f2c230;--coral:#e4572e;--mist:#cfd8d4}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--ink);color:var(--paper)}
button,input{font:inherit;border-radius:8px;border:2px solid var(--paper);padding:.55rem .9rem}
input{background:transparent;color:var(--paper);width:100%}
button{background:var(--buoy);color:var(--ink);font-weight:700;border-color:var(--buoy);cursor:pointer}
button.alt{background:transparent;color:var(--paper);border-color:var(--paper)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.screen{display:none;height:100%}.screen.on{display:block}
#home{max-width:30rem;margin:0 auto;padding:12vh 1.25rem 2rem}
#home h1{font-size:2.4rem;line-height:1.1;margin:0 0 .25rem}
#home p{color:var(--mist);margin:.25rem 0 1.25rem}
.row{display:flex;gap:.5rem;margin:.5rem 0}
.row>*{flex:1}
label{display:block;font-size:.85rem;color:var(--mist);margin-top:1rem}
#err{color:var(--coral);min-height:1.5rem}
#game{position:relative}
#pano{position:absolute;inset:0;background:#000}
#hud{position:absolute;top:.6rem;left:.6rem;right:.6rem;display:flex;justify-content:space-between;gap:.5rem;pointer-events:none;z-index:5}
.chip{background:rgba(15,59,74,.92);padding:.3rem .8rem;border-radius:999px;font-weight:600}
#mapbox{position:absolute;right:.6rem;bottom:.6rem;width:16rem;height:11rem;z-index:6;border:3px solid var(--paper);border-radius:12px;overflow:hidden;transition:width .15s,height .15s;background:var(--ink)}
#mapbox:hover,#mapbox.big{width:min(46rem,calc(100vw - 1.2rem));height:min(30rem,70vh)}
#map{position:absolute;inset:0}
#guessbtn{position:absolute;left:.5rem;right:.5rem;bottom:.5rem;z-index:1000}
#panel{position:absolute;left:.6rem;bottom:.6rem;z-index:6;background:rgba(15,59,74,.95);padding:.8rem 1rem;border-radius:12px;max-width:20rem;display:none}
#panel table{border-collapse:collapse;width:100%}
#panel td{padding:.15rem .5rem .15rem 0}
#panel td:last-child{text-align:right}
#lobby{padding:1rem 1.25rem}
</style>
</head>
<body>

<section id="home" class="screen on">
  <h1>LocationGuessr</h1>
  <p>Drop into a street, find where you are. Rooms connect players directly, no game server.</p>
  <label for="name">Your name</label>
  <input id="name" maxlength="16" autocomplete="nickname">
  <label for="tok">Mapillary access token <a href="https://www.mapillary.com/dashboard/developers" target="_blank" rel="noopener" style="color:var(--buoy)">(get one free)</a></label>
  <input id="tok" placeholder="MLY|...">
  <div class="row"><button id="create">Create room</button></div>
  <label for="code">Or join with a room code</label>
  <div class="row"><input id="code" maxlength="5" style="text-transform:uppercase"><button id="join" class="alt">Join room</button></div>
  <div id="err" role="alert"></div>
</section>

<section id="lobby" class="screen">
  <h2>Room <span id="rc"></span></h2>
  <p><button class="alt" id="copy">Copy invite link</button></p>
  <ul id="plist"></ul>
  <div id="hostctl" class="row" style="max-width:24rem">
    <input id="rounds" type="number" min="1" max="10" value="5" aria-label="Rounds">
    <input id="secs" type="number" min="15" max="300" value="60" aria-label="Seconds per round">
    <button id="start">Start game</button>
  </div>
  <p id="wait" style="color:var(--mist)">Waiting for the host to start.</p>
</section>

<section id="game" class="screen">
  <div id="pano"></div>
  <div id="hud"><span class="chip" id="rinfo"></span><span class="chip" id="timer"></span></div>
  <div id="panel"></div>
  <div id="mapbox"><div id="map"></div><button id="guessbtn" disabled>Place a pin to guess</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mapillary-js@4.1.2/dist/mapillary.js"></script>
<script>
const $=s=>document.querySelector(s);
const show=id=>{document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id))};
const PREFIX='locguessr-';
const CITIES=[[48.857,2.352],[51.507,-0.128],[52.52,13.405],[55.676,12.568],[41.903,12.496],[40.416,-3.704],[59.329,18.069],[50.075,14.438],[47.497,19.04],[38.722,-9.139],[40.713,-74.006],[34.052,-118.244],[41.878,-87.63],[43.651,-79.347],[19.433,-99.133],[-23.55,-46.633],[-34.604,-58.382],[4.711,-74.072],[-33.869,151.209],[-37.814,144.963],[-36.849,174.763],[35.676,139.65],[37.567,126.978],[25.033,121.565],[13.756,100.502],[1.352,103.82],[-6.209,106.846],[28.614,77.209],[-26.204,28.047],[-33.925,18.424],[-1.286,36.817],[30.044,31.236],[41.009,28.978],[55.756,37.617],[59.934,30.336],[60.17,24.94],[53.35,-6.26],[45.501,-73.567],[49.282,-123.121],[-12.046,-77.043]];
let peer,hostConn,isHost=false,myId='host',room='';
let conns={},players={};            // host: id -> {name,total}
let H={rounds:[],idx:-1,guesses:{},secs:60,timer:null};  // host-only state
let G={viewer:null,map:null,pin:null,layer:null,cfg:null,guessed:false,t0:0,iv:null,cur:null};

/* ---------- helpers ---------- */
const km=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 12742*Math.asin(Math.sqrt(x))};
const pts=d=>Math.round(5000*Math.exp(-d/1500));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const err=m=>{$('#err').textContent=m};
const store=(k,v)=>{try{v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};

/* ---------- networking (star topology, host is authoritative) ---------- */
function bc(m){Object.values(conns).forEach(c=>c.open&&c.send(m));onMsg(m)}
function toHost(m){isHost?hostRecv('host',m):hostConn.send(m)}

function makeRoom(){
  isHost=true;myId='host';
  room=Math.random().toString(36).slice(2,7).toUpperCase();
  peer=new Peer(PREFIX+room);
  peer.on('open',()=>{players.host={name:$('#name').value.trim()||'Host',total:0};enterLobby()});
  peer.on('error',e=>{if(e.type==='unavailable-id')makeRoom();else err('Connection problem: '+e.type)});
  peer.on('connection',c=>{
    c.on('data',m=>hostRecv(c.peer,m,c));
    c.on('close',()=>{delete conns[c.peer];delete players[c.peer];pushLobby()});
  });
}
function joinRoom(code){
  isHost=false;room=code;
  peer=new Peer();
  peer.on('open',id=>{
    myId=id;hostConn=peer.connect(PREFIX+code,{reliable:true});
    hostConn.on('open',()=>{hostConn.send({t:'hello',name:$('#name').value.trim()||'Player'});enterLobby()});
    hostConn.on('data',onMsg);
    hostConn.on('close',()=>{alert('Host left the room.');location.search='';});
  });
  peer.on('error',e=>err(e.type==='peer-unavailable'?'No room with that code.':'Connection problem: '+e.type));
}
function hostRecv(id,m,c){
  if(m.t==='hello'){conns[id]=c;players[id]={name:m.name.slice(0,16),total:0};pushLobby()}
  else if(m.t==='guess'&&H.open&&!H.guesses[id]){
    H.guesses[id]={lat:m.lat,lng:m.lng};
    bc({t:'count',n:Object.keys(H.guesses).length,of:Object.keys(players).length});
    if(Object.keys(H.guesses).length>=Object.keys(players).length)finishRound();
  }
}
function pushLobby(){bc({t:'lobby',list:Object.values(players).map(p=>p.name)})}

/* ---------- host: game flow ---------- */
async function findSpot(token){
  for(let i=0;i<12;i++){
    const [la,ln]=CITIES[Math.random()*CITIES.length|0],r=.06;
    const y=la+(Math.random()*2-1)*r,x=ln+(Math.random()*2-1)*r,s=.012;
    const u=`https://graph.mapillary.com/images?access_token=${encodeURIComponent(token)}&fields=id,computed_geometry&is_pano=true&limit=30&bbox=${x-s},${y-s},${x+s},${y+s}`;
    try{
      const j=await (await fetch(u)).json();
      if(j.error)throw new Error(j.error.message);
      if(j.data&&j.data.length){const p=j.data[Math.random()*j.data.length|0];return{img:p.id,lat:p.computed_geometry.coordinates[1],lng:p.computed_geometry.coordinates[0]}}
    }catch(e){if(/token|OAuth|access/i.test(e.message))throw e}
  }
  throw new Error('Could not find street imagery. Try again.');
}
async function startGame(){
  const n=Math.min(10,Math.max(1,+$('#rounds').value||5));
  H.secs=Math.min(300,Math.max(15,+$('#secs').value||60));
  $('#start').disabled=true;$('#start').textContent='Finding places…';
  try{H.rounds=await Promise.all(Array.from({length:n},()=>findSpot(G.token)))}
  catch(e){$('#start').disabled=false;$('#start').textContent='Start game';alert(e.message);return}
  Object.values(players).forEach(p=>p.total=0);H.idx=-1;
  nextRound();
}
function nextRound(){
  H.idx++;H.guesses={};H.open=true;
  const r=H.rounds[H.idx];
  bc({t:'round',n:H.idx+1,of:H.rounds.length,img:r.img,secs:H.secs});
  clearTimeout(H.timer);H.timer=setTimeout(finishRound,H.secs*1000+1500);
}
function finishRound(){
  clearTimeout(H.timer);if(!H.open)return;
  const r=H.rounds[H.idx],res=[];
  for(const [id,p] of Object.entries(players)){
    const g=H.guesses[id];let d=null,s=0;
    if(g){d=km(r.lat,r.lng,g.lat,g.lng);s=pts(d);p.total+=s}
    res.push({name:p.name,g,d,s,total:p.total});
  }
  res.sort((a,b)=>b.total-a.total);
  H.open=false;
  bc({t:'result',target:{lat:r.lat,lng:r.lng},res,last:H.idx===H.rounds.length-1});
}

/* ---------- client: UI ---------- */
function onMsg(m){
  if(m.t==='lobby'){
    $('#plist').innerHTML=m.list.map(n=>`<li>${esc(n)}</li>`).join('');
  }else if(m.t==='round')startRound(m);
  else if(m.t==='count'){if(!G.guessed)return;$('#timer').textContent=`Waiting ${m.n}/${m.of}`}
  else if(m.t==='result')showResult(m);
}
function enterLobby(){
  show('lobby');$('#rc').textContent=room;
  $('#hostctl').style.display=isHost?'flex':'none';
  $('#wait').style.display=isHost?'none':'block';
  if(isHost)pushLobby();
}
function initMap(){
  if(G.map)return;
  G.map=L.map('map',{worldCopyJump:true,zoomControl:false,attributionControl:false}).setView([25,10],1);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(G.map);
  G.layer=L.layerGroup().addTo(G.map);
  G.map.on('click',e=>{
    if(G.guessed)return;
    G.cur=e.latlng;G.layer.clearLayers();L.marker(e.latlng).addTo(G.layer);
    $('#guessbtn').disabled=false;$('#guessbtn').textContent='Lock in guess';
  });
}
function startRound(m){
  show('game');initMap();
  G.guessed=false;G.cur=null;G.layer.clearLayers();G.map.setView([25,10],1);
  $('#mapbox').classList.remove('big');$('#panel').style.display='none';
  $('#guessbtn').disabled=true;$('#guessbtn').style.display='';$('#guessbtn').textContent='Place a pin to guess';
  $('#rinfo').textContent=`Round ${m.n} of ${m.of}`;
  if(!G.viewer){
    G.viewer=new mapillary.Viewer({accessToken:G.token,container:'pano',imageId:m.img,component:{cover:false}});
    addEventListener('resize',()=>G.viewer.resize());
  }else G.viewer.moveTo(m.img).catch(()=>{});
  setTimeout(()=>G.map.invalidateSize(),50);
  G.t0=Date.now()+m.secs*1000;clearInterval(G.iv);
  G.iv=setInterval(()=>{
    const s=Math.max(0,Math.ceil((G.t0-Date.now())/1000));
    if(!G.guessed)$('#timer').textContent=`${s}s`;
    if(s===0){clearInterval(G.iv);if(!G.guessed&&G.cur)submit()}
  },250);
}
function submit(){
  if(G.guessed||!G.cur)return;
  G.guessed=true;$('#guessbtn').disabled=true;$('#guessbtn').textContent='Guess locked';
  $('#timer').textContent='Waiting for others';
  toHost({t:'guess',lat:G.cur.lat,lng:G.cur.lng});
}
function showResult(m){
  clearInterval(G.iv);G.guessed=true;
  $('#mapbox').classList.add('big');$('#guessbtn').style.display='none';
  G.layer.clearLayers();
  const t=[m.target.lat,m.target.lng],pts_=[t];
  L.circleMarker(t,{radius:9,color:'#e4572e',fillColor:'#e4572e',fillOpacity:1}).addTo(G.layer);
  m.res.forEach(r=>{if(!r.g)return;const p=[r.g.lat,r.g.lng];pts_.push(p);
    L.marker(p).bindTooltip(esc(r.name),{permanent:true}).addTo(G.layer);
    L.polyline([t,p],{color:'#0f3b4a',dashArray:'6 6'}).addTo(G.layer)});
  setTimeout(()=>{G.map.invalidateSize();G.map.fitBounds(pts_,{padding:[40,40],maxZoom:12})},200);
  const rows=m.res.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.d==null?'no guess':Math.round(r.d)+' km'}</td><td>+${r.s}</td><td><b>${r.total}</b></td></tr>`).join('');
  $('#panel').innerHTML=`<table>${rows}</table>`+(isHost?`<p><button id="nx">${m.last?'Back to lobby':'Next round'}</button></p>`:`<p style="color:var(--mist)">${m.last?'Game over.':'Waiting for host…'}</p>`);
  $('#panel').style.display='block';
  $('#timer').textContent=m.last?'Final scores':'Round over';
  if(isHost)$('#nx').onclick=()=>{if(m.last){$('#start').disabled=false;$('#start').textContent='Start game';bc({t:'lobby',list:Object.values(players).map(p=>p.name)});show('lobby')}else nextRound()};
}

/* ---------- boot ---------- */
$('#name').value=load('lg-name');$('#tok').value=load('lg-tok');
const qr=new URLSearchParams(location.search).get('room');if(qr)$('#code').value=qr.toUpperCase();
function ready(){
  const tok=$('#tok').value.trim();
  if(!tok){err('Paste your Mapillary token first.');return false}
  G.token=tok;store('lg-tok',tok);store('lg-name',$('#name').value.trim());err('');return true;
}
$('#create').onclick=()=>{if(ready())makeRoom()};
$('#join').onclick=()=>{const c=$('#code').value.trim().toUpperCase();if(ready()){if(c.length<5)err('Enter the 5-letter room code.');else joinRoom(c)}};
$('#start').onclick=startGame;
$('#guessbtn').onclick=submit;
$('#copy').onclick=()=>{navigator.clipboard.writeText(`${location.origin}${location.pathname}?room=${room}`);$('#copy').textContent='Copied'};
</script>
</body>
</html>
